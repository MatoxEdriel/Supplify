<p-panel styleClass="login-panel dark-background">
    <div class="p-grid bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-[100vw] overflow-hidden">
        <div class="p-grid p-align-center p-justify-center" style="height: 100vh; "
            style="display:grid; grid-template-columns: 1fr 1fr; gap:16px">
            <div class="p-col-12 p-md-6">
                <div class="p-d-flex p-flex-column p-align-center w-full bg-surface-0 dark:bg-surface-900 py-20 px-8 sm:px-20">
                    <div class="text-center mb-4">
                        <div class="text-3xl font-medium mb-4">Supplify</div>
                        <span class="text-muted">Sign in to continue</span>
                    </div>

                    <label for="email" class="block text-xl font-medium mb-2">Email</label>
                    <input pInputText id="email" type="email" placeholder="Email address" class="w-full mb-4" />

                    <label for="password" class="block text-xl font-medium mb-2">Password</label>
                    <p-password id="password" placeholder="Password" toggleMask="true" styleClass="mb-4"
                        [fluid]="true"></p-password>

                    <div class="p-d-flex p-ai-center p-jc-between w-full">
                        <div class="p-d-flex p-ai-center">
                            <p-checkbox label="Remember me"></p-checkbox>
                        </div>
                        <a href="#" class="font-medium text-primary">Forgot password?</a>
                    </div>

                    <p-button label="Sign In" styleClass="w-full mt-4"></p-button>
                </div>
            </div>

            <div class="p-col-12 p-md-6">
                <img src="https://imgs.search.brave.com/BBK9_fyfASoHcw4JLyAJmgNXOJLMf07TltiiY8tqA1w/rs:fit:500:0:0:0/g:ce/aHR0cHM6Ly9jZG4u/bWFya2V0aW5nYW5k/d2ViLmVzL3dwLWNv/bnRlbnQvdXBsb2Fk/cy8yMDE1LzA2L2lt/YWdlLXVybC1ob3N0/LnBuZw" alt="Login Image"
                    style="width: 100%; height: 100%; object-fit: cover;">
            </div>
        </div>

    </div>
</p-panel>
